name: AgentProof application CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    name: application-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare Node for application tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.2'
          package-manager-cache: false
      - name: Verify application commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          printf 'Verified application commit: %s\n' "$actual_commit"
          node --version
          npm --version
      - name: Run application tests
        run: npm --userconfig=/dev/null test

  source-checks:
    name: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare Node for syntax checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.2'
          package-manager-cache: false
      - name: Verify syntax commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          printf 'Verified syntax commit: %s\n' "$actual_commit"
          node --version
      - name: Run syntax checks
        run: npm --userconfig=/dev/null run check
